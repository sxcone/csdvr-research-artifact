name: Verify research artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier runtime dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 PyYAML==6.0.2

      - name: Compile principal Python scripts
        run: |
          python -m py_compile \
            01_experiments/run_ase_autonomous_repair_v6.py \
            01_experiments/run_ase_repository_scalability_v6.py \
            01_experiments/analyze_ase_paired_v6.py \
            01_experiments/audit_ase_revision_v6.py \
            01_experiments/resolve_contract_verifier_major_revisions_v18.py

      - name: Regenerate paired contrasts
        run: python 01_experiments/analyze_ase_paired_v6.py

      - name: Run independent numeric audit
        run: python 01_experiments/audit_ase_revision_v6.py

      - name: Run four-task contract/verifier recheck
        run: |
          python 01_experiments/resolve_contract_verifier_major_revisions_v18.py
          grep -q "Local task/verifier reruns passing: \*\*4/4\*\*" 02_results/contract_verifier_major_revision_report_v18.md
          grep -q '"all_four_pass_local_rerun": true' 02_results/contract_verifier_major_revision_evidence_v18.json

      - name: Require a clean deterministic audit
        run: |
          grep -q "Checks: 52" 02_results/ase_revision_numeric_audit_v6.md
          grep -q "Failures: 0" 02_results/ase_revision_numeric_audit_v6.md
          git diff --exit-code -- \
            02_results/ase_autonomous_repair_aggregate_v6.csv \
            02_results/ase_autonomous_repair_paired_contrasts_v6.csv \
            02_results/ase_autonomous_repair_paired_contrasts_v6.md \
            02_results/ase_revision_numeric_audit_v6.md
